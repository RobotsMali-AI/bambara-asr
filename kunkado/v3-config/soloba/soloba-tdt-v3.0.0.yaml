model:
  name: "RobotsMali/soloba-tdt-0.6b-v0.5"
  first_training: True  # SET TO FALSE

tokenizer:
  path: "tokenizers/soloba/"
  type: "bpe"

data_loaders:
  train:
    manifest_filepath: "./manifests/train-kunkado.jsonl"
    sample_rate: 16000
    max_duration: 30
    min_duration: 0.1
    batch_size: 16  # smaller batch if memory insufficient
    num_workers: 8
    shuffle: True
    pin_memory: True
  valid:
    manifest_filepath: "./manifests/test-kunkado.jsonl"  # Path to the validation manifest
    sample_rate: 16000
    max_duration: 15
    min_duration: 0.1
    batch_size: 32
    num_workers: 8
    shuffle: False
    pin_memory: True
  test:
    manifest_filepath: "./manifests/test-kunkado.jsonl" # Path to the test manifest
    sample_rate: 16000
    max_duration: 30
    min_duration: 0.1
    batch_size: 32
    num_workers: 8
    shuffle: False
    pin_memory: True

wandb:
  project: "kunkado" # Ensure this matches your WandB project name
  name: "soloba-ctc-v3.0.0" # Ensure this is unique for each run

optim:
  name: "adamw"
  # Slightly lower LR if unfreezing
  lr: 2
  betas: [0.9, 0.98]
  weight_decay: 1e-4
  sched:
    name: "NoamAnnealing"
    max_steps: 52100  # (epochs * steps_per_epoch)
    warmup_steps: 6000
    warmup_ratio: null
    d_model: 512
    min_lr: 1e-6
    last_epoch: -1

training:
  # freezing the encoder
  freeze_encoder: False
  precision: "bf16-mixed"
  checkpoint_dir: "./checkpoints/${wandb.name}-checkpoints"
  save_top_k: 1
  patience: 20  # more patience
  epochs: 100
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1
  resume_if_exists: True
  resume_ignore_no_checkpoint: True
  save_model_path: "models/${wandb.name}.nemo"
