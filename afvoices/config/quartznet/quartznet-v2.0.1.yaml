model:
  name: "RobotsMali/stt-bm-quartznet15x5-V0"
  first_training: True

tokenizer:
  path: null
  type: "char"
  vocab: [' ', "'", '-', 'a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z', 'à', 'è', 'é', 'ô', 'ù', 'ŋ', 'ɔ', 'ɛ', 'ɲ']

data_loaders:
  train:
    manifest_filepath: "./manifests/train/train-soloni.jsonl" # Ensure this is the correct path to your training manifest
    sample_rate: 16000
    max_duration: 30
    min_duration: 0.1
    batch_size: 64
    num_workers: 8
    shuffle: True
    normalize_transcripts: False
    labels: [' ', "'", '-', 'a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z', 'à', 'è', 'é', 'ô', 'ù', 'ŋ', 'ɔ', 'ɛ', 'ɲ']
  valid:
    manifest_filepath: "./manifests/test/test-soloni.jsonl"
    sample_rate: 16000
    max_duration: 10
    batch_size: 32
    num_workers: 8
    shuffle: False
    normalize_transcripts: False
    labels: [' ', "'", '-', 'a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z', 'à', 'è', 'é', 'ô', 'ù', 'ŋ', 'ɔ', 'ɛ', 'ɲ']
  test:
    manifest_filepath: "./manifests/test/test-soloni.jsonl"
    sample_rate: 16000
    max_duration: 30
    batch_size: 32
    num_workers: 8
    shuffle: False
    normalize_transcripts: False
    labels: [' ', "'", '-', 'a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z', 'à', 'è', 'é', 'ô', 'ù', 'ŋ', 'ɔ', 'ɛ', 'ɲ']

optim:
  name: "novograd"
  lr: 1e-3
  betas: [0.95, 0.5]
  weight_decay: 1e-3
  sched:
    name: "CosineAnnealing"
    max_steps: 65500 # Ensure this is the same as the number of training steps
    warmup_ratio: null
    warmup_steps: 6000
    min_lr: 1e-6
    last_epoch: -1

wandb:
  project: "afvoices"      # Ensure this matches your WandB project name
  name: "quartznet-v2.0.1"     # Ensure this is unique for each run
  model: "quartznet"

training:
  freeze_encoder: False
  precision: 32 # "bf16-mixed"
  checkpoint_dir: "./checkpoints/${wandb.model}" # Remember to change this if wandb.name has changed
  save_top_k: 1
  patience: 25
  epochs: 100
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1
  resume_if_exists: True
  resume_ignore_no_checkpoint: True
  save_model_path: "models/${wandb.name}.nemo" # Remember to change this if wandb.name is changed
