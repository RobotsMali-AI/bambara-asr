model:
  name: "nvidia/parakeet-tdt-0.6b-v2"
  first_training: True  # SET TO FALSE

tokenizer:
  path: "tokenizers/soloba/"
  type: "bpe"

data_loaders:
  train:
    manifest_filepath: "./manifests/train-soloba-v0.jsonl"
    sample_rate: 16000
    max_duration: 30
    min_duration: 0.1
    batch_size: 16   # smaller batch if memory insufficient
    num_workers: 8
    shuffle: True
    pin_memory: True
  valid:
    manifest_filepath: "./manifests/test-soloba-v0.jsonl"  # Path to the validation manifest
    sample_rate: 16000
    max_duration: 15
    min_duration: 0.1
    batch_size: 32
    num_workers: 8
    shuffle: False
    pin_memory: True
  test:
    manifest_filepath: "./manifests/test-soloba-v0.jsonl" # Path to the test manifest
    sample_rate: 16000
    max_duration: 30
    min_duration: 0.1
    batch_size: 32
    num_workers: 8
    shuffle: False
    pin_memory: True

wandb:
  project: "afvoices" # Ensure this matches your WandB project name
  name: "soloba-tdt-v0.0.0" # Ensure this is unique for each run

optim:
  name: "adamw"
  # Slightly lower LR if unfreezing
  lr: 1e-2
  betas: [0.9, 0.98]
  weight_decay: 1e-4
  sched:
    name: "NoamAnnealing"
    max_steps: 183086  # (epochs * steps_per_epoch)
    warmup_ratio: 0.1
    d_model: 1024
    min_lr: 1e-7
    last_epoch: -1

training:
  # freezing the encoder
  freeze_encoder: False
  precision: "bf16-mixed"
  checkpoint_dir: "./checkpoints/soloba-v0.0.0-checkpoints"
  save_top_k: 1
  patience: 15  # more patience
  epochs: 100
  accumulate_grad_batches: 2  # effective batch size 64 (2GPUs * batch_size * accum)
  check_val_every_n_epoch: 1
  resume_if_exists: True
  resume_ignore_no_checkpoint: True
  save_model_path: "models/soloba-v0.0.0.nemo"
