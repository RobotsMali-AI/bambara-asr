[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "rlnf"
version = "0.2"
description = "An implementation of Reinforcement Learning from Human Feedback for ASR"
readme = "README.md"
license = "MIT" 
authors = [
  { name = "'RobotsMali AI4D Lab'", email = "diarray@robotsmali.org" },
]
dependencies = [
  "torch>=1.6",
  "torchaudio",
  "transformers",
  "datasets>=1.14.0",
  "evaluate",
  "librosa",
  "numpy",
  "accelerate>=0.26.0",
  "transformers[torch]"
]
requires-python = ">=3.8"
keywords = ["audio", "reinforcement learning", "rlnf", "pytorch", "nemo","transformers"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Panga-Az/matchboxnet"
Repository = "https://github.com/Panga-Az/matchboxnet"
#Documentation = "https://github.com/Panga-Az/matchboxnet#readme"

[tool.setuptools.packages.find]
include = ["rlnf*"]
