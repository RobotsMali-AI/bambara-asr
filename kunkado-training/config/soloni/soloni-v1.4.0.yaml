model:
  name: "models/soloni-v1.2.0.nemo"
  first_training: False

tokenizer:
  path: "tokenizers/soloni"
  type: "bpe"

data_loaders:
  train:
    manifest_filepath: "./manifests/train-quartznet-v1.jsonl"
    sample_rate: 16000
    max_duration: 30
    min_duration: 0.1
    batch_size: 128  # smaller batch
    num_workers: 8
    shuffle: True
    pin_memory: True
  valid:
    manifest_filepath: "./manifests/test-quartznet-v1.jsonl"  # Path to the validation manifest
    sample_rate: 16000
    max_duration: 10
    batch_size: 32
    num_workers: 8
    shuffle: False
    pin_memory: True
  test:
    manifest_filepath: "./manifests/test-quartznet-v1.jsonl" # Path to the test manifest
    sample_rate: 16000
    max_duration: 30
    batch_size: 32
    num_workers: 8
    shuffle: False
    pin_memory: True

wandb:
  project: "kunkado" # Ensure this matches your WandB project name
  name: "soloni-v1.4.0" # Ensure this is unique for each run

optim:
  name: "adamw"
  # Slightly lower LR if unfreezing
  lr: 1e-4
  betas: [0.9, 0.98]
  weight_decay: 1e-4
  sched:
    name: "NoamAnnealing"
    max_steps: 12545  # (epochs * steps_per_epoch)
    warmup_ratio: 0.1
    d_model: 512 # only for NoamAnnealing scheduler
    min_lr: 1e-7
    last_epoch: -1


training:
  # freezing the encoder
  freeze_encoder: True
  precision: "bf16-mixed"
  checkpoint_dir: "./checkpoints/${wandb.name}-checkpoints"
  save_top_k: 1
  patience: 25  # more patience
  epochs: 50
  accumulate_grad_batches: 1  # effective batch size 128
  check_val_every_n_epoch: 1
  resume_if_exists: True
  resume_ignore_no_checkpoint: True
  save_model_path: "models/${wandb.name}.nemo"
