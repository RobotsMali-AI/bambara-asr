model:
  name: "./models/soloni-v2.1.0.nemo"
  first_training: False

tokenizer:
  path: "tokenizers/soloni"
  type: "bpe"

data_loaders:
  train:
    manifest_filepath: "./manifests/train/train-soloni.jsonl"
    sample_rate: 16000
    max_duration: 30
    min_duration: 0.1
    batch_size: 64  # smaller batch
    num_workers: 8
    shuffle: True
    pin_memory: True
  valid:
    manifest_filepath: "./manifests/test/test-soloni.jsonl"  # Path to the validation manifest
    sample_rate: 16000
    max_duration: 10
    batch_size: 32
    num_workers: 8
    shuffle: False
    pin_memory: True
  test:
    manifest_filepath: "./manifests/test/test-soloni.jsonl" # Path to the test manifest
    sample_rate: 16000
    max_duration: 30
    batch_size: 32
    num_workers: 8
    shuffle: False
    pin_memory: True

wandb:
  project: "afvoices" # Ensure this matches your WandB project name
  name: "soloni-v2.2.0" # Ensure this is unique for each run
  model: "soloni"

optim:
  name: "adamw"
  # Slightly lower LR if unfreezing
  lr: 1.3
  betas: [0.9, 0.98]
  weight_decay: 1e-3
  sched:
    name: "NoamAnnealing"
    max_steps: 32750  # (epochs * steps_per_epoch)
    warmup_steps: 1500
    warmup_ratio: null
    d_model: 512 # only for NoamAnnealing scheduler
    min_lr: 1e-6
    last_epoch: -1


training:
  # freezing the encoder
  freeze_encoder: False
  precision: "bf16-mixed"
  checkpoint_dir: "./checkpoints/${wandb.model}"
  save_top_k: 1
  patience: 20  # more patience
  epochs: 50
  accumulate_grad_batches: 1  # effective batch size 256
  check_val_every_n_epoch: 1
  resume_if_exists: True
  resume_ignore_no_checkpoint: True
  save_model_path: "models/${wandb.name}.nemo"
