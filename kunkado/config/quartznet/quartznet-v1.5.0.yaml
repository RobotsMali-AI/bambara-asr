model:
  name: "models/quartznet-v1.3.0.nemo"
  first_training: False

tokenizer:
  path: null
  type: "char"
  vocab: [' ', "'", '-', 'a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z', 'à', 'â', 'ç', 'è', 'é', 'ê', 'î', 'ï', 'ô', 'ù', 'û', 'ė', 'ŋ', 'œ', 'ɔ', 'ɛ', 'ɲ']

data_loaders:
  train:
    manifest_filepath: "./manifests/train-quartznet-v1.jsonl" # Ensure this is the correct path to your training manifest
    sample_rate: 16000
    max_duration: 30
    min_duration: 0.1
    batch_size: 50
    num_workers: 8
    shuffle: True
    normalize_transcripts: False
    labels: [' ', "'", '-', 'a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z', 'à', 'â', 'ç', 'è', 'é', 'ê', 'î', 'ï', 'ô', 'ù', 'û', 'ė', 'ŋ', 'œ', 'ɔ', 'ɛ', 'ɲ']
  valid:
    manifest_filepath: "./manifests/test-quartznet-v1.jsonl"
    sample_rate: 16000
    max_duration: 10
    batch_size: 32
    num_workers: 8
    shuffle: False
    normalize_transcripts: False
    labels: [' ', "'", '-', 'a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z', 'à', 'â', 'ç', 'è', 'é', 'ê', 'î', 'ï', 'ô', 'ù', 'û', 'ė', 'ŋ', 'œ', 'ɔ', 'ɛ', 'ɲ']
  test:
    manifest_filepath: "./manifests/test-quartznet-v1.jsonl"
    sample_rate: 16000
    max_duration: 15
    batch_size: 32
    num_workers: 8
    shuffle: False
    normalize_transcripts: False
    labels: [' ', "'", '-', 'a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z', 'à', 'â', 'ç', 'è', 'é', 'ê', 'î', 'ï', 'ô', 'ù', 'û', 'ė', 'ŋ', 'œ', 'ɔ', 'ɛ', 'ɲ']

optim:
  name: "novograd"
  lr: 1e-3
  betas: [0.95, 0.5]
  weight_decay: 1e-4
  sched:
    name: "CosineAnnealing"
    max_steps: 44956 # Ensure this is the same as the number of training steps
    warmup_ratio: 0.6
    min_lr: 1e-7
    last_epoch: -1

wandb:
  project: "kunkado"      # Ensure this matches your WandB project name
  name: "quartznet-v1.5.0"     # Ensure this is unique for each run

training:
  freeze_encoder: False
  precision: null # "bf16-mixed"
  checkpoint_dir: "${wandb.name}-checkpoints" # Remember to change this if wandb.name has changed
  save_top_k: 1
  patience: 25
  epochs: 70
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1
  resume_if_exists: True
  resume_ignore_no_checkpoint: True
  save_model_path: "models/${wandb.name}.nemo" # Remember to change this if wandb.name is changed
