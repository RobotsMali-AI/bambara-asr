model:
  name: "RobotsMali/stt-bm-quartznet15x5-V0"
  first_training: True

tokenizer:
  path: null
  type: "char"
  vocab: [' ', "'", '-', 'a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z', 'à', 'â', 'ç', 'è', 'é', 'ê', 'î', 'ï', 'ô', 'ù', 'û', 'ė', 'ŋ', 'œ', 'ɔ', 'ɛ', 'ɲ', '’', '<APPLAUDISSEMENTS>', '<BRUITS>', '<CHEVAUCHEMENT>', '<ECHO>', '<INCOMPRÉHENSIBLE>', '<INVOCATION>', '<MUSIQUE>', '<RIRES>', '<TOUX>', '<CRIS>', '<PLEURES>']

data_loaders:
  train:
    manifest_filepath: "bam-asr-all/manifests/train-manifest.json" # Ensure this is the correct path to your training manifest
    sample_rate: 16000
    max_duration: 45
    min_duration: 0.1
    batch_size: 64
    num_workers: 8
    shuffle: True
    normalize_transcripts: False
  valid:
    manifest_filepath: "bam-asr-all/manifests/test-manifest.json"
    sample_rate: 16000
    max_duration: 30
    batch_size: 32
    num_workers: 8
    shuffle: False
    normalize_transcripts: False
  test:
    manifest_filepath: "bam-asr-all/manifests/test-manifest.json"
    sample_rate: 16000
    max_duration: 45
    batch_size: 32
    num_workers: 8
    shuffle: False
    normalize_transcripts: False

optim:
  name: "novograd"
  lr: 5e-4
  betas: [0.95, 0.5]
  weight_decay: 1e-3
  sched:
    name: "CosineAnnealing"
    max_steps: 14530 # Ensure this is the same as the number of training steps
    warmup_ratio: 0.07
    min_lr: 1e-6
    last_epoch: -1

wandb:
  project: "kunkado"      # Ensure this matches your WandB project name
  name: "quartznet-v1.0.0"     # Ensure this is unique for each run

training:
  freeze_encoder: False
  precision: null # "bf16-mixed"
  checkpoint_dir: "quartznet-v1.0.0-checkpoints" # Remember to change this if wandb.name has changed
  save_top_k: 2
  patience: 10
  epochs: 20
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1
  resume_if_exists: True
  resume_ignore_no_checkpoint: True
  save_model_path: "models/quartznet-v1.0.0.nemo" # Remember to change this if wandb.name is changed
